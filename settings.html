<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wilbert Hub — Settings</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",system-ui,sans-serif;color:#faf7ff}body{min-height:100vh;padding:92px 18px 30px;background:radial-gradient(circle at 18% 8%,rgba(168,85,247,.3),transparent 32%),radial-gradient(circle at 84% 82%,rgba(124,58,237,.24),transparent 36%),#08030f}nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px;border:1px solid rgba(216,180,254,.28);border-radius:20px;background:rgba(18,6,31,.75);backdrop-filter:blur(20px);z-index:5}nav button{width:44px;height:40px;border:0;border-radius:13px;background:transparent;color:#fff;font-size:19px;cursor:pointer}nav button:hover{background:rgba(168,85,247,.16)}main{max-width:820px;margin:auto}h1{text-align:center;font-size:clamp(46px,9vw,82px);letter-spacing:-.06em;margin:12px 0 28px;background:linear-gradient(135deg,#fff,#d8b4fe,#a855f7);-webkit-background-clip:text;color:transparent}.panel{padding:22px;border:1px solid rgba(216,180,254,.24);border-radius:20px;background:rgba(28,10,48,.7);backdrop-filter:blur(16px);box-shadow:0 16px 42px rgba(0,0,0,.25);margin-bottom:14px}.row{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:13px 0;border-bottom:1px solid rgba(216,180,254,.1)}.row:last-child{border-bottom:0}.label{font-weight:800}.muted{color:#a996b8;font-size:12px;margin-top:4px}.control{accent-color:#a855f7}.btn{border:1px solid rgba(216,180,254,.25);border-radius:13px;padding:11px 14px;background:rgba(168,85,247,.1);color:#fff;font:700 13px "Trebuchet MS",system-ui,sans-serif;cursor:pointer}.btn:hover{background:rgba(168,85,247,.24);border-color:#c084fc}.swatches{display:flex;gap:9px;flex-wrap:wrap}.swatch{width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.35);cursor:pointer}.status{color:#bda7ca;font-size:12px}
</style></head><body><nav><button onclick="location.href='studyhub.html'">⌂</button><button onclick="location.href='enrichment.html'">◈</button><button onclick="location.href='resources.html'">▦</button><button onclick="location.href='browser.html'">◎</button><button onclick="location.href='settings.html'">⚙</button></nav><main><h1>SETTINGS</h1><section class="panel"><div class="row"><div><div class="label">Motion</div><div class="muted">Keep interface movement enabled.</div></div><input id="motion" class="control" type="checkbox" checked></div><div class="row"><div><div class="label">Glass blur</div><div class="muted">Adjust the hub panel softness.</div></div><input id="blur" class="control" type="range" min="8" max="28" value="18"></div><div class="row"><div><div class="label">Purple intensity</div><div class="muted">Tune the glow used by the hub.</div></div><input id="glow" class="control" type="range" min="10" max="45" value="28"></div></section><section class="panel"><div class="label">Quick actions</div><div class="muted" style="margin-bottom:14px">Open the browser layer directly for anything else.</div><button class="btn" onclick="location.href='browser.html'">Open Browser</button></section><div class="status">Wilbert Hub • purple edition</div></main>
<script>const m=document.getElementById("motion"),b=document.getElementById("blur"),g=document.getElementById("glow");const save=()=>{localStorage.setItem("wh-motion",m.checked?"1":"0");localStorage.setItem("wh-blur",b.value);localStorage.setItem("wh-glow",g.value)};m.checked=localStorage.getItem("wh-motion")!=="0";b.value=localStorage.getItem("wh-blur")||18;g.value=localStorage.getItem("wh-glow")||28;[m,b,g].forEach(x=>x.addEventListener("input",save));</script></body></html>
