<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wilbert Hub</title>
<style>
:root{--bg:#08030f;--panel:rgba(28,10,48,.72);--line:rgba(216,180,254,.28);--purple:#a855f7;--lav:#e9d5ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",system-ui,sans-serif;color:#faf7ff}
body{min-height:100vh;overflow:hidden;background:radial-gradient(circle at 18% 12%,rgba(168,85,247,.32),transparent 30%),radial-gradient(circle at 82% 78%,rgba(124,58,237,.25),transparent 34%),var(--bg)}
body:after{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.025),transparent 35%,rgba(168,85,247,.05))}
.top{position:fixed;top:18px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px;border:1px solid var(--line);border-radius:22px;background:rgba(18,6,31,.72);backdrop-filter:blur(20px);box-shadow:0 18px 55px rgba(0,0,0,.35);z-index:10}
.top button{width:46px;height:42px;border:0;border-radius:14px;background:transparent;color:#f8efff;font-size:20px;cursor:pointer}.top button:hover{background:rgba(168,85,247,.16);transform:translateY(-1px)}
.shell{min-height:100vh;display:grid;place-items:center;padding:80px 22px 30px}.hero{text-align:center;max-width:900px}
.eyebrow{font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:#c4a4df;margin-bottom:18px}
h1{margin:0;font-size:clamp(58px,13vw,138px);line-height:.86;letter-spacing:-.075em;font-weight:900;background:linear-gradient(135deg,#fff 20%,#e9d5ff 55%,#a855f7);-webkit-background-clip:text;color:transparent;text-shadow:0 0 40px rgba(168,85,247,.28)}
.sub{margin:24px auto 30px;max-width:560px;color:#b9a6ca;font-size:14px;line-height:1.7}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:11px}.action{border:1px solid var(--line);border-radius:15px;padding:13px 18px;background:var(--panel);color:#fff;font:700 14px "Trebuchet MS",system-ui,sans-serif;cursor:pointer;backdrop-filter:blur(16px);transition:.2s}.action:hover{transform:translateY(-3px);border-color:#c084fc;background:rgba(124,58,237,.25);box-shadow:0 12px 35px rgba(124,58,237,.18)}
.note{margin-top:32px;display:inline-flex;padding:9px 13px;border:1px solid rgba(216,180,254,.16);border-radius:999px;color:#9f8cab;font-size:11px;background:rgba(255,255,255,.025)}
.orb{position:fixed;border-radius:50%;filter:blur(2px);pointer-events:none;opacity:.35}.o1{width:12px;height:12px;left:12%;bottom:12%;background:#c084fc;box-shadow:0 0 28px #c084fc}.o2{width:18px;height:18px;right:14%;top:28%;background:#7c3aed;box-shadow:0 0 32px #7c3aed}.o3{width:8px;height:8px;right:28%;bottom:18%;background:#e9d5ff}
</style></head><body>
<nav class="top"><button onclick="location.href='studyhub.html'" title="Home">⌂</button><button onclick="location.href='enrichment.html'" title="Games">◈</button><button onclick="location.href='resources.html'" title="Apps">▦</button><button onclick="location.href='browser.html'" title="Browser">◎</button><button onclick="location.href='settings.html'" title="Settings">⚙</button></nav>
<main class="shell"><section class="hero"><div class="eyebrow">private purple space</div><h1>WILBERT<br>HUB</h1><p class="sub">A cleaner launchpad for games, apps and the built-in browser. Everything external opens through the same browser layer.</p><div class="actions"><button class="action" onclick="location.href='enrichment.html'">Games</button><button class="action" onclick="location.href='resources.html'">Apps</button><button class="action" onclick="location.href='browser.html'">Browser</button></div><div class="note">purple / glass / minimal</div></section></main>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
</body></html>
