<!DOCTYPE html>
<html>
<head>
    <title>Wilbert Hub — Home</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="aether-favicon.png">
    <style>
        :root{--w:#7c3aed;--w2:#a855f7;--bg:#090511}
        *{box-sizing:border-box}
        html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:#f7f2ff;font-family:Inter,system-ui,sans-serif}
        body{display:flex;flex-direction:column;align-items:center;justify-content:center;background:
          radial-gradient(circle at 15% 15%,rgba(124,58,237,.28),transparent 34%),
          radial-gradient(circle at 85% 80%,rgba(168,85,247,.2),transparent 38%),var(--bg)}
        body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(124,58,237,.12),transparent 45%,rgba(168,85,247,.08));}
        .wilbert-brand{position:fixed;top:18px;left:22px;z-index:20;font:800 13px/1 system-ui,sans-serif;letter-spacing:.18em;color:#e9d5ff}
        .appleseed{position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:18px;min-width:320px;padding:9px 18px;border:1px solid rgba(168,85,247,.55);border-radius:18px;background:rgba(20,8,38,.78);box-shadow:0 12px 40px rgba(0,0,0,.3),0 0 30px rgba(124,58,237,.14);backdrop-filter:blur(18px)}
        .nav-action,.homebutton{width:46px;height:42px;padding:0;border:0;background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;transition:.2s}
        .nav-action:hover,.homebutton:hover{transform:scale(1.1);opacity:.85}
        .icon{width:28px;height:28px;display:block}
        .browser-icon{width:30px;height:30px;border:2px solid #fff;border-radius:50%;position:relative}
        .browser-icon:before{content:"";position:absolute;inset:6px;border:1px solid #fff;border-radius:50%}
        .browser-icon:after{content:"";position:absolute;left:3px;right:3px;top:13px;border-top:1px solid #fff}
        .home-icon{width:30px;height:26px;position:relative;background:#fff;clip-path:polygon(50% 0,100% 42%,88% 42%,88% 100%,12% 100%,12% 42%,0 42%)}
        .settings-icon{font-size:28px}
        .brand{font-size:clamp(54px,12vw,140px);font-weight:800;letter-spacing:-.07em;margin:0;z-index:5;text-align:center;text-shadow:0 0 32px rgba(168,85,247,.55)}
        .brand span{background:linear-gradient(135deg,#fff 25%,#d8b4fe 75%,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
        .tag{margin:8px 0 22px;color:rgba(255,255,255,.55);font-size:12px;letter-spacing:.18em;text-transform:uppercase;z-index:5}
        .button-wrapper{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;z-index:5}
        .hub-btn{appearance:none;border:1px solid rgba(168,85,247,.58);border-radius:14px;padding:13px 18px;background:rgba(20,8,38,.72);color:#f7f2ff;font-weight:700;cursor:pointer;box-shadow:0 10px 30px rgba(0,0,0,.2);backdrop-filter:blur(14px);transition:.2s}
        .hub-btn:hover{transform:translateY(-2px);background:rgba(124,58,237,.28);border-color:#c084fc}
        .messages{position:fixed;left:18px;bottom:18px;z-index:10;width:min(360px,calc(100vw - 36px));display:flex;flex-direction:column;gap:8px}
        .message{align-self:flex-start;padding:10px 14px;border:1px solid rgba(168,85,247,.4);border-radius:14px 14px 14px 5px;background:rgba(20,8,38,.72);box-shadow:0 8px 24px rgba(0,0,0,.25);backdrop-filter:blur(12px);font-size:14px;color:#f5eaff}
        .bubble-container{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
        .bubble{position:absolute;bottom:-40px;left:var(--x);width:var(--s);height:var(--s);border-radius:50%;background:var(--c);box-shadow:0 0 18px var(--c);opacity:.55;animation:float var(--t) linear infinite;animation-delay:var(--d)}
        @keyframes float{to{transform:translate3d(var(--dx),-115vh,0);opacity:0}}
        @media(max-width:600px){.appleseed{min-width:0;width:auto;gap:8px;padding:8px 10px}.wilbert-brand{top:auto;bottom:18px;left:18px}.brand{font-size:clamp(48px,15vw,82px)}.tag{margin-bottom:18px}}
    </style>
</head>
<body>
<div class="wilbert-brand">WILBERT HUB</div>

<nav class="appleseed" aria-label="Navigation">
  <button class="nav-action" onclick="openBrowser()" title="Browser" aria-label="Browser"><span class="browser-icon"></span></button>
  <button class="homebutton" onclick="location.href='studyhub.html'" title="Home" aria-label="Home"><span class="home-icon"></span></button>
  <button class="nav-action" onclick="location.href='resources.html'" title="Tools" aria-label="Tools"><span class="icon">▦</span></button>
  <button class="nav-action" onclick="location.href='settings.html'" title="Settings" aria-label="Settings"><span class="settings-icon">⚙</span></button>
</nav>

<h1 class="brand"><span>WILBERT HUB</span></h1>
<div class="tag">purple mode • browser enabled</div>

<div class="button-wrapper">
  <button class="hub-btn" onclick="location.href='enrichment.html'">g@m3s</button>
  <button class="hub-btn" onclick="location.href='resources.html'">@pps</button>
  <button class="hub-btn" onclick="openBrowser()">browser</button>
  <button class="hub-btn" onclick="location.href='research.html'">s3arch</button>
</div>

<div class="messages" aria-label="Messages">
  <div class="message">Wilbert tuff?</div>
  <div class="message">hello</div>
</div>

<div class="bubble-container" aria-hidden="true">
  <div class="bubble" style="--x:5%;--dx:40px;--s:14px;--t:9s;--d:0s;--c:#a855f7"></div>
  <div class="bubble" style="--x:18%;--dx:-30px;--s:24px;--t:13s;--d:2s;--c:#7c3aed"></div>
  <div class="bubble" style="--x:34%;--dx:50px;--s:16px;--t:8s;--d:1s;--c:#c084fc"></div>
  <div class="bubble" style="--x:52%;--dx:-45px;--s:28px;--t:15s;--d:5s;--c:#a855f7"></div>
  <div class="bubble" style="--x:72%;--dx:35px;--s:18px;--t:10s;--d:3s;--c:#8b5cf6"></div>
  <div class="bubble" style="--x:90%;--dx:-40px;--s:25px;--t:12s;--d:6s;--c:#c084fc"></div>
</div>

<script>
function openBrowser(){
  const target=encodeURIComponent("https://www.google.com/");
  location.href="static-scramjet.html?url="+target;
}
</script>
</body>
</html>
