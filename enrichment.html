<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wilbert Hub — Games</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Trebuchet MS",system-ui,sans-serif;color:#faf7ff}body{padding:92px 18px 30px;background:radial-gradient(circle at 18% 8%,rgba(168,85,247,.3),transparent 32%),radial-gradient(circle at 84% 82%,rgba(124,58,237,.24),transparent 36%),#08030f}nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px;border:1px solid rgba(216,180,254,.28);border-radius:20px;background:rgba(18,6,31,.75);backdrop-filter:blur(20px);z-index:5}nav button{width:44px;height:40px;border:0;border-radius:13px;background:transparent;color:#fff;font-size:19px;cursor:pointer}nav button:hover{background:rgba(168,85,247,.16)}main{max-width:1100px;margin:auto}h1{text-align:center;font-size:clamp(46px,9vw,88px);line-height:.9;letter-spacing:-.06em;margin:12px 0 10px;background:linear-gradient(135deg,#fff,#d8b4fe,#a855f7);-webkit-background-clip:text;color:transparent}.sub{text-align:center;color:#aa98bb;margin:0 0 28px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}.card{min-height:172px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;text-decoration:none;color:#fff;border:1px solid rgba(216,180,254,.24);border-radius:20px;background:rgba(28,10,48,.7);backdrop-filter:blur(16px);box-shadow:0 16px 42px rgba(0,0,0,.25);transition:.2s}.card:hover{transform:translateY(-5px);border-color:#c084fc;box-shadow:0 0 32px rgba(168,85,247,.18)}.art{height:120px;display:grid;place-items:center;font-size:40px;font-weight:900;background:linear-gradient(135deg,#4c1d95,#7c3aed 48%,#c084fc)}.name{padding:15px 16px;font-weight:800}.loading{grid-column:1/-1;text-align:center;color:#aa98bb;padding:35px}.error{grid-column:1/-1;text-align:center;color:#d8b4fe;padding:20px;border:1px solid rgba(216,180,254,.24);border-radius:16px;background:rgba(28,10,48,.7)}
</style></head><body><nav><button onclick="location.href='studyhub.html'">⌂</button><button onclick="location.href='enrichment.html'">◈</button><button onclick="location.href='resources.html'">▦</button><button onclick="location.href='browser.html'">◎</button><button onclick="location.href='settings.html'">⚙</button></nav><main><h1>GAMES</h1><p class="sub">A large game vault. Every game opens through the built-in browser.</p><div id="grid" class="grid"><div class="loading">loading…</div></div></main>
<script>
const catalogs=[
 {index:"https://cdn.jsdelivr.net/gh/gmshelf/seraph/seraph.json",base:"https://cdn.jsdelivr.net/gh/gmshelf/seraph"},
 {index:"https://cdn.jsdelivr.net/gh/gmshelf/ugs/ugs.json",base:"https://cdn.jsdelivr.net/gh/gmshelf/ugs"},
 {index:"https://cdn.jsdelivr.net/gh/gmshelf/ckv/ckv.json",base:"https://cdn.jsdelivr.net/gh/gmshelf/ckv"}
];
const fallback=[["2048","https://play2048.co/"],["Agar.io","https://agar.io/"],["Slither.io","https://slither.io/"],["Shell Shockers","https://shellshock.io/"],["Diep.io","https://diep.io/"],["Krunker","https://krunker.io/"]];
function card(name,url,i){const a=document.createElement("a");a.className="card";a.href="browser.html?url="+encodeURIComponent(url);const art=document.createElement("div");art.className="art";art.textContent=["✦","◈","◆","◇","★","●"][i%6];const n=document.createElement("div");n.className="name";n.textContent=name;a.append(art,n);grid.appendChild(a)}
async function load(){const grid=document.getElementById("grid");grid.innerHTML="";const seen=new Set();let total=0;for(const s of catalogs){try{const r=await fetch(s.index,{cache:"no-store"});if(!r.ok)continue;const d=await r.json();const list=Array.isArray(d)?d:(d.games||[]);for(const g of list){if(!g?.name||!g?.url)continue;const u=s.base+(s.base.includes("/ckv")?g.url.replace(/\.html$/,"2.html"):g.url);if(seen.has(u))continue;seen.add(u);card(g.name,u,total++);if(total>=80)break}}catch(e){}if(total>=80)break}if(!total)fallback.forEach((g,i)=>card(g[0],g[1],i))}
load();
</script></body></html>
