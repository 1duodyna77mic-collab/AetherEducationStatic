<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wilbert Hub — Games</title>
<style>
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,sans-serif;color:#f7f2ff;background:#090511}
*{box-sizing:border-box}
body{background:radial-gradient(circle at 20% 10%,rgba(124,58,237,.3),transparent 35%),radial-gradient(circle at 85% 80%,rgba(168,85,247,.22),transparent 38%),#090511;padding:100px 18px 30px;box-sizing:border-box}
nav{position:fixed;top:15px;left:50%;transform:translateX(-50%);display:flex;gap:10px;padding:10px 14px;border:1px solid rgba(168,85,247,.55);border-radius:18px;background:rgba(20,8,38,.82);backdrop-filter:blur(18px);z-index:5}
nav button{border:0;background:transparent;color:white;font-size:22px;padding:8px 12px;cursor:pointer}
main{max-width:1000px;margin:auto}h1{text-align:center;font-size:clamp(42px,9vw,82px);margin:10px 0 30px;text-shadow:0 0 28px rgba(168,85,247,.65)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.card{position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:250px;text-decoration:none;color:white;border:1px solid rgba(192,132,252,.38);border-radius:22px;background:rgba(20,8,38,.78);box-shadow:0 18px 45px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.08);transition:.25s;backdrop-filter:blur(16px)}
.card:hover{transform:translateY(-6px) scale(1.01);border-color:#c084fc;box-shadow:0 24px 60px rgba(0,0,0,.38),0 0 34px rgba(124,58,237,.22)}
.thumb{height:150px;position:relative;display:grid;place-items:center;overflow:hidden;background:linear-gradient(135deg,var(--c1),var(--c2))}
.thumb:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.12),transparent 45%,rgba(0,0,0,.22))}
.thumb svg{width:82%;height:82%;position:relative;z-index:1;filter:drop-shadow(0 12px 20px rgba(0,0,0,.28))}
.card-copy{padding:18px 20px 20px}.card b{font-size:20px;letter-spacing:-.02em}.card span{display:block;margin-top:7px;color:#cdb8e9;font-size:13px;line-height:1.45}
</style></head><body>
<nav><button onclick="location.href='studyhub.html'" title="Home">⌂</button><button onclick="location.href='enrichment.html'" title="Games">🎮</button><button onclick="location.href='resources.html'" title="Apps">▦</button><button onclick="location.href='settings.html'" title="Settings">⚙</button></nav>
<main><h1>GAMES</h1><div class="grid">

<a class="card" href="https://agar.io/" target="_blank" rel="noopener"><b>Agar.io</b><span>Multiplayer arena</span></a>
<a class="card" href="https://slither.io/" target="_blank" rel="noopener"><b>Slither.io</b><span>Arcade multiplayer</span></a>
<a class="card" href="https://shellshock.io/" target="_blank" rel="noopener"><b>Shell Shockers</b><span>Browser FPS</span></a>
<a class="card" href="https://diep.io/" target="_blank" rel="noopener"><b>Diep.io</b><span>Tank arena</span></a>
<a class="card" href="https://krunker.io/" target="_blank" rel="noopener"><b>Krunker</b><span>Browser FPS</span></a>
</div></main></body></html>
